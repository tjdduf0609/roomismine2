  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-mono); font-feature-settings:'calt' on; line-height:1.6; min-height:100vh; position:relative; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 0%, rgba(0,166,156,0.10), transparent 60%); z-index:0; }
  #app { position:relative; z-index:1; }
  .wrap { max-width:640px; margin:0 auto; padding:2.25rem 1.25rem 3.5rem; }
  h1, h2 { font-family:var(--font-mono); font-weight:400; margin:0; }
  p { margin:.6rem 0 0; }
  .eyebrow { font-size:.8rem; color:var(--accent); margin:0; }
  .top h1 { font-size:clamp(1.4rem, 4.5vw, 1.9rem); line-height:1.3; margin-top:.5rem; }
  .lede { color:var(--text-muted); font-size:.92rem; }

  .scene { position:relative; background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.32)), var(--panel-alt); border:1px solid var(--line); border-radius:6px; padding:3.4rem 1rem 1.4rem; box-shadow:0 14px 34px var(--shadow); overflow:hidden; }
  .hud-back { position:absolute; top:.7rem; left:.7rem; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none; font-size:.85rem; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2; font-family:var(--font-mono); }
  .hud-back:hover { background:rgba(0,0,0,.72); }
  .cam-badge { position:absolute; top:2.5rem; left:.75rem; display:flex; align-items:center; gap:.35rem; font-size:.62rem; color:#7be3c4; letter-spacing:.03em; }
  .cam-badge--flush { top:.75rem; }
  .rec-dot { width:7px; height:7px; border-radius:50%; background:var(--danger); animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.2;} }
  .shift-badge { position:absolute; top:.7rem; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.55); color:#fff; padding:.32rem .85rem; border-radius:999px; font-size:.72rem; white-space:nowrap; }
  .monitor-panel { position:absolute; top:.7rem; right:.7rem; background:#05100d; border:1px solid rgba(70,230,180,.35); color:#3fe6ac; padding:.45rem .7rem; border-radius:4px; font-size:.7rem; text-align:right; line-height:1.5; }
  .monitor-value { font-size:1rem; }
  .monitor-sub { font-size:.65rem; opacity:.85; }

  .patient-card { position:relative; background:repeating-linear-gradient(var(--panel), var(--panel) 26px, var(--line) 27px); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:2px; padding:1.4rem 1.4rem 1.3rem; box-shadow:0 10px 24px var(--shadow); clip-path:polygon(0% 2%, 4% 0%, 9% 1.8%, 15% 0%, 21% 1.8%, 27% 0%, 33% 1.8%, 39% 0%, 45% 1.8%, 51% 0%, 57% 1.8%, 63% 0%, 69% 1.8%, 75% 0%, 81% 1.8%, 87% 0%, 93% 1.8%, 99% 0%, 100% 2%, 100% 100%, 0% 100%); }
  .rule-text { font-size:.85rem; color:var(--text-muted); }
  .field-label { display:block; font-size:.8rem; color:var(--text-muted); margin-top:1rem; }
  input[type=text] { width:100%; margin-top:.35rem; font-family:var(--font-mono); font-size:.95rem; padding:.65rem .75rem; border-radius:3px; border:1px solid var(--line); background:var(--panel-alt); color:var(--text); }
  input[type=text]:focus-visible { outline:2px solid var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.45rem; }
  .chip { font-family:var(--font-mono); font-size:.85rem; padding:.45rem .85rem; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  .chip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .chip[aria-checked="true"] { background:var(--accent); border-color:var(--accent); color:#06110f; }
  .hint { font-size:.78rem; color:var(--text-muted); }
  .hint--error { color:var(--danger); }
  .center { text-align:center; }

  .btn-pill { display:block; width:100%; text-align:center; background:#050807; color:#fff; border:1px solid rgba(255,255,255,.15); border-radius:6px; padding:.85rem 1rem; font-family:var(--font-mono); font-size:.9rem; letter-spacing:.05em; margin-top:1.1rem; cursor:pointer; }
  .btn-pill:hover:not(:disabled) { background:#141a18; }
  .btn-pill:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .btn-pill:disabled { opacity:.55; cursor:default; }
  .btn-pill--primary { background:var(--accent); color:#06110f; border-color:var(--accent); }
  .btn-pill--primary:hover:not(:disabled) { background:var(--accent-strong); }
  .btn-row { display:flex; gap:.7rem; flex-wrap:wrap; }
  .btn-row .btn-pill { flex:1 1 140px; }

  .menu-list { display:grid; gap:.8rem; margin-top:1.5rem; }
  .menu-item { display:block; text-align:left; width:100%; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:4px; padding:1rem 1.1rem; color:var(--text); font-family:var(--font-mono); cursor:pointer; }
  .menu-item:hover { background:var(--panel-alt); }
  .menu-item:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mi-title { display:block; font-size:1.05rem; }
  .mi-desc { display:block; font-size:.8rem; color:var(--text-muted); margin-top:.25rem; }
  .footnote { margin-top:1.5rem; font-size:.76rem; color:var(--text-muted); border-top:1px dashed var(--line); padding-top:1rem; }

  .round-track { height:5px; background:var(--panel-alt); border-radius:3px; overflow:hidden; margin-bottom:.9rem; }
  .round-fill { height:100%; width:100%; background:var(--warn); }
  .round-fill--ritual { background:var(--danger); width:0; }

  /* --- cctv --- */
  .cgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:.5rem; margin-top:.6rem; }
  .tile { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:.2rem; min-height:128px; background:#04100f; border:1px solid rgba(70,230,180,.3); border-radius:3px; padding:1.3rem .35rem .45rem; color:#bdf1ff; font-family:var(--font-mono); cursor:pointer; overflow:hidden; }
  .tile::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 2px, transparent 4px); pointer-events:none; }
  .tile:hover:not(:disabled) { border-color:#7be3c4; }
  .tile:disabled { cursor:default; }
  .tile-cam { position:absolute; top:.25rem; left:.35rem; font-size:.6rem; color:#7be3c4; }
  .tile-emoji { font-size:1.7rem; line-height:1.2; }
  .tile-text { font-size:.72rem; line-height:1.35; text-align:center; }
  .tile.bad { border-color:var(--danger); opacity:.55; }

  /* --- ritual --- */
  .cdgrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:.5rem; margin-top:.6rem; }
  .cdgrid.cols5 { grid-template-columns:repeat(5, 1fr); }
  .cd { position:relative; height:84px; background:#0a0e0d; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .cd:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .wax { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:15px; height:32px; background:#d9cdb0; border-radius:2px; }
  .flame { position:absolute; bottom:44px; left:50%; transform:translateX(-50%); width:14px; height:22px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; display:none; }
  .cd.lit .flame { display:block; background:#ffb347; box-shadow:0 0 14px 4px rgba(255,160,60,.7); animation:flick .5s infinite alternate; }
  .cd.blue .flame { display:block; background:#6ab7ff; box-shadow:0 0 14px 4px rgba(90,170,255,.85); animation:flick .5s infinite alternate; }
  @keyframes flick { from { transform:translateX(-50%) scale(1); } to { transform:translateX(-50%) scale(1.12); } }

  /* --- result --- */
  .res-score { font-size:2.1rem; margin-top:.4rem; color:var(--accent); }
  .res-who { font-size:.95rem; margin-top:.2rem; }
  .res-line { font-size:.86rem; color:var(--text-muted); margin-top:.3rem; }
  .res-record { font-size:.9rem; color:var(--warn); margin-top:.7rem; }
  .res-stamp { font-size:.75rem; color:var(--text-muted); margin-top:.9rem; }

  .toast { position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%); background:var(--text); color:var(--bg); font-size:.8rem; padding:.55rem .95rem; border-radius:4px; z-index:5; }

  @media (prefers-reduced-motion: reduce) { .rec-dot, .cd.lit .flame, .cd.blue .flame { animation:none; } }
</style>
</head>

  var CCTV_ANOM_SUBTLE = [
    '같은 구간을 정확히 같은 간격으로 왕복 중', '그림자가 몸과 다른 방향으로 늘어짐',
    '움직임이 반 박자 늦게 따라옴', '문 앞에 서서 들어오지 않고 계속 기다림',
    '눈을 한 번도 깜빡이지 않음 (10분째)', '손에 든 서류가 계속 같은 장에서 넘어가지 않음',
    '의자에 앉은 채 몸의 방향만 천천히 돌아가는 중'
  ];
  var ANOM_ALL = CCTV_ANOM_OBVIOUS.concat(CCTV_ANOM_SUBTLE);

  var GAMES = {
    cctv: { title:'CCTV 관찰실', short:'이상 행동을 보이는 화면을 찾으세요. 갈수록 빠르고 복잡해집니다.',
      rule:'생명 3개로 시작합니다. 이상 행동을 보이는 화면을 누르세요. 찾을수록 제한 시간은 짧아지고 화면은 늘어나며 비슷해 보이는 화면이 섞입니다. 엉뚱한 화면을 누르거나 시간이 지나면 생명이 줄어듭니다.' },
    ritual: { title:'죽음의 의식', short:'촛불을 끄며 최대한 오래 버티세요. 시간이 갈수록 촛불이 빨라집니다.',
      rule:'의식 진행도가 100%가 될 때까지 버티는 게임입니다. 붉은 촛불을 끄면 점수를 얻고 진행도가 조금 줄어듭니다. 푸른 불꽃은 건드리면 점수가 깎이고 진행도가 오릅니다. 시간이 갈수록 촛불이 빠르게, 더 많이 켜집니다.' }
  };
  var ORDER = ['cctv', 'ritual'];

  var app = document.getElementById('app');
  var view = 'menu', gameKey = null, lockedGame = false;
  var player = { name:'', team:'' };
  var G = null, R = null, loopId = null, sched = [];

  // ---------- 공통 ----------
  function now(){ return Date.now(); }
  function secureInt(n){
    var c = window.crypto || window.msCrypto;
    if (!c || !c.getRandomValues) return Math.floor(Math.random() * n);
    var buf = new Uint32Array(1), limit = Math.floor(4294967296 / n) * n;
    do { c.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }
  function chance(p){ return secureInt(1000) < p * 1000; }
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = secureInt(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a){ return a[secureInt(a.length)]; }
  function pickN(a, n){ return shuffle(a).slice(0, n); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function stamp(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function hearts(n, max){ var s = ''; for (var i = 0; i < max; i++) s += i < n ? '\u2665' : '\u2661'; return s; }
  function $(id){ return document.getElementById(id); }
  function loadProfile(){
    try { var p = JSON.parse(localStorage.getItem('ah_room_profile') || 'null'); if (p) { player.name = p.name || ''; player.team = p.team || ''; } } catch (e) {}
  }
  function saveProfile(){ try { localStorage.setItem('ah_room_profile', JSON.stringify(player)); } catch (e) {} }
  function bestOf(k){ try { return parseInt(localStorage.getItem('ah_room_best_' + k) || '0', 10) || 0; } catch (e) { return 0; } }
  function saveBest(k, v){ try { localStorage.setItem('ah_room_best_' + k, String(v)); } catch (e) {} }

  function later(ms, fn){ sched.push({ at:now() + ms, fn:fn }); }
  function stopLoop(){ if (loopId) { cancelAnimationFrame(loopId); loopId = null; } sched = []; }
  function runLoop(update){
    stopLoop();
    (function frame(){
      var t = now(), due = [], rest = [];
      for (var i = 0; i < sched.length; i++) (sched[i].at <= t ? due : rest).push(sched[i]);
      sched = rest;
      for (var k = 0; k < due.length; k++) due[k].fn();
      if (view !== 'play' || !G) return;
      update(t);
      if (view === 'play' && G) loopId = requestAnimationFrame(frame);
    })();
  }

  function chrome(badge, monitorHtml, back){
    return (back ? '<button class="hud-back" data-act="' + back + '" aria-label="뒤로">←</button>' : '') +
      '<div class="cam-badge' + (back ? '' : ' cam-badge--flush') + '"><span class="rec-dot"></span>CAM-04</div>' +
      '<div class="shift-badge">' + badge + '</div>' +
      (monitorHtml ? '<div class="monitor-panel">' + monitorHtml + '</div>' : '');
  }
  function shell(inner){ return '<div class="wrap"><div class="scene">' + inner + '</div></div>'; }
  function monitor(label, valId, val, subHtml){
    return label + '<br><span class="monitor-value" id="' + valId + '">' + val + '</span>' + (subHtml ? '<div class="monitor-sub">' + subHtml + '</div>' : '');
  }
  function statHtml(extra){ return '점수 <span id="mon-score">' + G.score + '</span><br>' + extra; }
  function setScore(){ var s = $('mon-score'); if (s) s.textContent = G.score; }
  function setLives(){ var l = $('mon-lives'); if (l) l.textContent = hearts(G.lives, 3); }
  function toast(msg){
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 1600);
  }

  function finish(score, lines){
    var prev = bestOf(gameKey), record = score > prev;
    if (record) saveBest(gameKey, score);
    R = { game:gameKey, name:player.name, team:player.team, score:score, lines:lines, at:new Date(), record:record, prev:prev };
    stopLoop(); G = null; view = 'result'; render();
  }

  // ---------- CCTV 관찰실 (찾을수록 빨라지고 복잡해짐) ----------
  var CCTV = {
    msFor: function(c){ return Math.max(2000, 8000 - c * 170); },
    tilesFor: function(c){ return c < 5 ? 9 : 12; },
    start: function(){
      G = { game:'cctv', lives:3, score:0, correct:0, wrong:0, timeouts:0, combo:0, maxCombo:0, tiles:[], ai:-1, deadline:0, ms:0 };
      CCTV.newRound();
    },
    newRound: function(){
      if (!G) return;
      var c = G.correct, n = CCTV.tilesFor(c), ai = secureInt(n), tiles = [];
      var decoyP = Math.min(0.55, 0.2 + c * 0.02), subtleP = c < 8 ? 0 : Math.min(0.8, (c - 7) * 0.1);
      for (var i = 0; i < n; i++) {
        var anomaly = i === ai;
        tiles.push({ cam:i + 1, emoji:pick(SPECIES).emoji, anomaly:anomaly, bad:false,
          text: anomaly ? pick(chance(subtleP) ? CCTV_ANOM_SUBTLE : CCTV_ANOM_OBVIOUS) : (chance(decoyP) ? pick(CCTV_DECOY) : pick(CCTV_NORMAL)) });
      }
      G.tiles = tiles; G.ai = ai; G.ms = CCTV.msFor(c); G.deadline = now() + G.ms; render();
    },
    view: function(){
      var tiles = G.tiles.map(function(t, i){
        return '<button class="tile" data-act="tile" data-i="' + i + '"><span class="tile-cam">CAM-' + pad(t.cam) + '</span>' +
          '<span class="tile-emoji">' + t.emoji + '</span><span class="tile-text">' + t.text + '</span></button>';
      }).join('');
      return shell(chrome('CCTV 관찰실', monitor('찾은 개체', 'mon-val', G.correct, statHtml('<span id="mon-lives">' + hearts(G.lives, 3) + '</span>')), 'exit') +
        '<div class="round-track"><div class="round-fill" id="rbar"></div></div>' +
        '<p class="hint center">이상 행동을 보이는 화면을 누르세요. <span id="combo-t">' + (G.combo >= 2 ? G.combo + '콤보!' : '') + '</span></p>' +
        '<div class="cgrid">' + tiles + '</div>');
    },
    update: function(t){
      var remain = G.deadline - t, bar = $('rbar');
      if (bar) bar.style.width = Math.max(0, remain / G.ms * 100) + '%';
      if (remain <= 0) {
        G.timeouts++; G.lives--; G.combo = 0; setLives();
        if (G.lives <= 0) CCTV.end(); else CCTV.newRound();
      }
    },
    click: function(act, el){
      if (act !== 'tile') return;
      var i = parseInt(el.getAttribute('data-i'), 10), tile = G.tiles[i];
      if (tile.bad) return;
      if (tile.anomaly) {
        var frac = Math.max(0, (G.deadline - now()) / G.ms);
        G.correct++; G.combo++; if (G.combo > G.maxCombo) G.maxCombo = G.combo;
        G.score += 10 + 2 * G.correct + Math.round(frac * 30) + 3 * Math.min(20, G.combo - 1);
        setScore(); CCTV.newRound();
      } else {
        tile.bad = true; G.wrong++; G.lives--; G.combo = 0; G.score = Math.max(0, G.score - 5);
        el.className += ' bad'; el.disabled = true; setScore(); setLives();
        if (G.lives <= 0) CCTV.end();
      }
    },
    end: function(){
      finish(G.score, ['찾은 이상 개체 ' + G.correct + '명 · 최고 콤보 ' + G.maxCombo, '오답 ' + G.wrong + '회 · 시간 초과 ' + G.timeouts + '회']);
    }
  };

  // ---------- 죽음의 의식 (시간이 갈수록 빨라지고 많아짐) ----------
  var Ritual = {
    levelAt: function(el){ return Math.floor(el / 12000) + 1; },
    countFor: function(L){ return L < 3 ? 12 : (L < 6 ? 16 : 20); },
    gridHtml: function(n){
      var cells = '';
      for (var i = 0; i < n; i++) cells += '<button class="cd" data-act="candle" data-i="' + i + '" aria-label="촛불 ' + (i + 1) + '"><span class="flame"></span><span class="wax"></span></button>';
      return cells;
    },
    start: function(){
      var t = now(), c = [];
      for (var i = 0; i < 12; i++) c.push({ s:0, until:0, litAt:0 });
      G = { game:'ritual', c:c, n:12, score:0, out:0, mistakes:0, combo:0, maxCombo:0, ritual:0, startAt:t, last:t, nextSpawn:t + 700, secs:0 };
      render();
    },
    view: function(){
      return shell(chrome('죽음의 의식', monitor('의식 진행도', 'mon-val', '0%', '점수 <span id="mon-score">' + G.score + '</span><br><span id="mon-lives">단계 1</span>'), 'exit') +
        '<div class="round-track"><div class="round-fill round-fill--ritual" id="rbar"></div></div>' +
        '<p class="hint center">붉은 촛불은 끄고, 푸른 불꽃은 건드리지 마세요. <span id="combo-t"></span></p>' +
        '<div class="cdgrid" id="cdgrid">' + Ritual.gridHtml(12) + '</div>');
    },
    paint: function(i){
      var grid = $('cdgrid'), el = grid && grid.children[i]; if (!el) return;
      var s = G.c[i].s; el.className = 'cd' + (s === 1 ? ' lit' : s === 2 ? ' blue' : '');
    },
    resize: function(n){
      while (G.c.length < n) G.c.push({ s:0, until:0, litAt:0 });
      G.n = n;
      var grid = $('cdgrid'); if (!grid) return;
      grid.className = 'cdgrid' + (n > 16 ? ' cols5' : '');
      grid.innerHTML = Ritual.gridHtml(n);
      for (var i = 0; i < n; i++) Ritual.paint(i);
    },
    update: function(t){
      var dt = Math.min(100, t - G.last); G.last = t;
      var elapsed = t - G.startAt, L = Ritual.levelAt(elapsed), i;
      if (Ritual.countFor(L) !== G.n) Ritual.resize(Ritual.countFor(L));
      if (t >= G.nextSpawn) {
        var off = [];
        for (i = 0; i < G.n; i++) if (G.c[i].s === 0) off.push(i);
        if (off.length) {
          var idx = pick(off), blue = elapsed > 8000 && chance(Math.min(0.4, 0.12 + L * 0.03));
          G.c[idx].s = blue ? 2 : 1; G.c[idx].litAt = t;
          G.c[idx].until = t + Math.max(1200, 2200 - L * 80); Ritual.paint(idx);
        }
        G.nextSpawn = t + Math.max(110, 850 - elapsed * 0.010);
      }
      var lit = 0;
      for (i = 0; i < G.n; i++) {
        if (G.c[i].s === 2 && t >= G.c[i].until) { G.c[i].s = 0; Ritual.paint(i); }
        if (G.c[i].s === 1) lit++;
      }
      G.ritual = Math.min(100, G.ritual + dt / 1000 * lit * (0.8 + 0.15 * L));
      var secs = Math.floor(elapsed / 1000);
      if (secs > G.secs) { G.score += 2 * (secs - G.secs); G.secs = secs; setScore(); }
      var bar = $('rbar'); if (bar) bar.style.width = G.ritual + '%';
      var mv = $('mon-val'); if (mv) mv.textContent = Math.round(G.ritual) + '%';
      var ml = $('mon-lives'); if (ml) ml.textContent = '단계 ' + L;
      if (G.ritual >= 100) Ritual.end(elapsed);
    },
    click: function(act, el){
      if (act !== 'candle') return;
      var i = parseInt(el.getAttribute('data-i'), 10), c = G.c[i], t = now();
      var L = Ritual.levelAt(t - G.startAt);
      if (c.s === 1) {
        c.s = 0; G.out++; G.combo++; if (G.combo > G.maxCombo) G.maxCombo = G.combo;
        G.score += 10 + 2 * L + ((t - c.litAt) < 700 ? 5 : 0) + Math.min(15, G.combo - 1);
        G.ritual = Math.max(0, G.ritual - 1.5);
        var ct = $('combo-t'); if (ct) ct.textContent = G.combo >= 2 ? G.combo + '콤보!' : '';
      } else if (c.s === 2) {
        c.s = 0; G.mistakes++; G.combo = 0; G.score = Math.max(0, G.score - 30); G.ritual = Math.min(100, G.ritual + 12);
        var ct2 = $('combo-t'); if (ct2) ct2.textContent = '';
      } else return;
      Ritual.paint(i); setScore();
    },
    end: function(elapsed){
      var sec = Math.floor(elapsed / 1000);
      finish(G.score, ['생존 시간 ' + sec + '초 · 도달 단계 ' + Ritual.levelAt(elapsed),
        '끈 촛불 ' + G.out + '개 · 최고 콤보 ' + G.maxCombo + ' · 푸른 불꽃 실수 ' + G.mistakes + '회']);
    }
  };
  var MODS = { cctv:CCTV, ritual:Ritual };

  // ---------- 화면 ----------
  function menuView(){
    var items = ORDER.map(function(k){
      var b = bestOf(k);
      return '<button class="menu-item" data-act="open" data-game="' + k + '"><span class="mi-title">' + GAMES[k].title + '</span><span class="mi-desc">' + GAMES[k].short + (b ? ' · 내 최고 ' + b + '점' : '') + '</span></button>';
    }).join('');
    return shell(chrome('진료실 미니게임', '', '') +
      '<header class="top"><p class="eyebrow">팀 대항 땅따먹기 · 미니게임 센터</p><h1>도전할 게임을 고르세요.</h1>' +
      '<p class="lede">모든 게임은 실패할 때까지 계속되는 기록 도전형입니다. 각 게임의 최고 점수 팀이 진료실을 차지합니다.</p></header>' +
      '<div class="menu-list">' + items + '</div>' +
      '<p class="footnote">게임이 끝나면 결과 화면(이름 · 팀 · 점수 · 시각)을 캡처해서 제출해 주세요.</p>');
  }
  function setupView(){
    var g = GAMES[gameKey], b = bestOf(gameKey);
    var chips = TEAMS.map(function(t){
      return '<button type="button" class="chip" role="radio" aria-checked="' + (player.team === t ? 'true' : 'false') + '" data-act="team" data-team="' + t + '">' + t + '</button>';
    }).join('');
    return shell(chrome(g.title, '', lockedGame ? '' : 'menu') +
      '<section class="patient-card"><p class="eyebrow">참가 등록' + (b ? ' · 내 최고 기록 ' + b + '점' : '') + '</p><p class="rule-text">' + g.rule + '</p>' +
      '<label class="field-label" for="name">이름</label>' +
      '<input id="name" type="text" maxlength="16" autocomplete="off" placeholder="커뮤니티 닉네임" value="' + esc(player.name) + '">' +
      '<span class="field-label" id="team-label">소속 팀</span>' +
      '<div class="chips" role="radiogroup" aria-labelledby="team-label">' + chips + '</div>' +
      '<p class="hint" id="setup-msg"></p></section>' +
      '<button class="btn-pill btn-pill--primary" data-act="start">게임 시작</button>');
  }
  function resultView(){
    var g = GAMES[R.game];
    var lines = R.lines.map(function(l){ return '<p class="res-line">' + esc(l) + '</p>'; }).join('');
    var rec = R.record ? '<p class="res-record">\uD83C\uDFC6 신기록! (이전 내 최고 ' + R.prev + '점)</p>' : '<p class="res-record">내 최고 기록 ' + R.prev + '점</p>';
    return shell(chrome('결과', '', 'exit') +
      '<section class="patient-card"><p class="eyebrow">' + g.title + '</p>' +
      '<h2 class="res-score">' + R.score + '점</h2>' +
      '<p class="res-who">' + esc(R.name) + ' · ' + esc(R.team) + '팀</p>' + lines + rec +
      '<p class="res-stamp">' + stamp(R.at) + '</p></section>' +
      '<p class="hint center">이 화면을 캡처해서 제출해 주세요.</p>' +
      '<div class="btn-row"><button class="btn-pill btn-pill--primary" data-act="again">다시 도전</button>' +
      '<button class="btn-pill" data-act="exit">' + (lockedGame ? '처음 화면' : '메뉴로') + '</button></div>');
  }
  function render(){
    if (view === 'menu') app.innerHTML = menuView();
    else if (view === 'setup') app.innerHTML = setupView();
    else if (view === 'play') app.innerHTML = MODS[gameKey].view();
    else if (view === 'result') app.innerHTML = resultView();
    if (view !== 'play') window.scrollTo(0, 0);
  }
  function syncName(){ var el = $('name'); if (el) player.name = el.value.trim(); }
  function startGame(){
    view = 'play'; G = null; window.scrollTo(0, 0);
    MODS[gameKey].start();
    runLoop(function(t){ if (MODS[gameKey].update) MODS[gameKey].update(t); });
  }

  app.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act');
    if (act === 'open') { gameKey = el.getAttribute('data-game'); view = 'setup'; render(); }
    else if (act === 'menu') { syncName(); view = 'menu'; render(); }
    else if (act === 'team') { syncName(); player.team = el.getAttribute('data-team'); render(); var n = $('name'); if (n && !n.value) n.focus(); }
    else if (act === 'start') {
      syncName();
      var msg = $('setup-msg');
      if (!player.name) { msg.className = 'hint hint--error'; msg.textContent = '이름을 입력해 주세요.'; $('name').focus(); return; }
      if (!player.team) { msg.className = 'hint hint--error'; msg.textContent = '소속 팀을 선택해 주세요.'; return; }
      saveProfile(); startGame();
    }
    else if (act === 'again') { startGame(); }
    else if (act === 'exit') { stopLoop(); G = null; view = lockedGame ? 'setup' : 'menu'; render(); }
    else if (view === 'play' && G) { MODS[gameKey].click(act, el); }
  });

  loadProfile();
  try {
    var q = new URLSearchParams(window.location.search).get('game');
    if (q && GAMES[q]) { gameKey = q; lockedGame = true; view = 'setup'; }
  } catch (e) {}
  render();
})();
</script>
</body>
</html>
